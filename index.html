<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Концепция: монтажный стол в телефоне. Шаги идут как клипы на таймлайне сверху, цена растёт чек-лентой под настройками, итог закреплён внизу. Один тёмный мир, как в прайс-листе: голубой акцент, жёлтый для брака, красный для срочности. */
:root {
  --bg: #0A0F1E;
  --panel: #111A30;
  --panel-2: #17223F;
  --line: #26335A;
  --fg: #E7ECF8;
  --muted: #8C9BBB;
  --accent: #38BDF8;
  --accent-ink: #06121F;
  --teal: #14B8A6;
  --violet: #8B5CF6;
  --warn: #EAB308;
  --hot: #EF4444;
  --good: #2DD4BF;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 15px/1.5 var(--f-body);
  padding-inline: 16px;
  background-image: radial-gradient(900px 420px at 50% -120px, rgba(56,189,248,.10), transparent 70%);
  background-repeat: no-repeat;
}
* { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { max-width: 560px; margin-inline: auto; min-height: 100dvh; display: flex; flex-direction: column; overflow-x: clip; }

/* верх: таймлайн шагов */
#top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  padding-block: 12px 10px;
  display: flex; flex-direction: column; gap: 10px;
}
.topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
.topline .where { font: 400 12px var(--f-mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
  display: grid; place-items: center; cursor: pointer; font-size: 16px; line-height: 1;
}
.icon-btn[disabled] { opacity: .3; cursor: default; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.tl button { all: unset; display: flex; flex-direction: column; gap: 6px; width: 100%; cursor: pointer; }
.tl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.tl .clip { height: 8px; border-radius: 4px; background: var(--line); transition: background .25s, box-shadow .25s; }
.tl .lab { font: 400 9px var(--f-mono); color: var(--muted); letter-spacing: .02em; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl li[data-state="done"] .clip { background: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.tl li[data-state="now"] .clip { background: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,.18); }
.tl li[data-state="now"] .lab { color: var(--fg); }
.tl li[data-state="off"] button { cursor: default; }

/* середина */
main { flex: 1; display: flex; flex-direction: column; gap: 20px; padding-block: 12px 28px; }
.step { display: flex; flex-direction: column; gap: 16px; animation: rise .28s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.eyebrow { margin: 0; font: 400 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1, h2 { margin: 0; font-family: var(--f-display); font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.1; }
h2 { font-size: 22px; line-height: 1.2; }
.lead { margin: 0; color: var(--muted); max-width: 46ch; }

.hero { padding-top: 9vh; gap: 22px; }
.hero .contact { margin: 0; text-align: center; font: 400 12px var(--f-mono); letter-spacing: .06em; color: var(--muted); }
.rates { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 14px; }
.rates dt { color: var(--muted); }
.rates dd { margin: 0; font: 600 14px var(--f-mono); text-align: right; }
.wave { display: flex; align-items: center; gap: 3px; height: 44px; }
.wave i { flex: 1; min-width: 2px; border-radius: 2px; background: var(--accent); opacity: .85; }
.wave i:nth-child(n+22) { background: var(--line); opacity: 1; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px;
  border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 16px; cursor: pointer; text-decoration: none;
}
.btn:hover { filter: brightness(1.08); }
.btn[disabled] { background: var(--panel-2); color: var(--muted); cursor: default; filter: none; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.pay { background: var(--good); color: #04201C; }

/* блоки настроек */
.ctrl { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.ctrl[data-off="true"] { opacity: .45; }
.ctrl-h { display: flex; flex-direction: column; gap: 2px; }
.ctrl-h label { font-weight: 600; }
.ctrl-h .hint { color: var(--muted); font-size: 13px; }
.num { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.nb { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); font-size: 22px; line-height: 1; cursor: pointer; }
.nb[disabled] { opacity: .3; cursor: default; }
.val { display: flex; align-items: baseline; gap: 8px; font-family: var(--f-mono); }
.val b { font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.val small { font-size: 14px; color: var(--muted); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; cursor: pointer; --p: 0%; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) var(--p), var(--line) var(--p)); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--fg); border: 3px solid var(--accent); margin-top: -8px; }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--fg); border: 3px solid var(--accent); }
input[type=range][disabled] { cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 14px; font: 400 13px var(--f-mono); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ctrl.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.note { margin: 0; font-size: 13px; color: var(--muted); }
.note.warn { color: var(--warn); }

/* переключатели */
.opts { display: flex; flex-direction: column; gap: 10px; }
#stage2:empty { display: none; }
.opt { position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); cursor: pointer; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.sw { width: 44px; height: 26px; border-radius: 13px; background: var(--line); position: relative; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--fg); transition: transform .2s; }
.opt input:checked + .sw { background: var(--accent); }
.opt input:checked + .sw::after { transform: translateX(18px); background: var(--accent-ink); }
.opt input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt.hot input:checked + .sw { background: var(--hot); }
.opt.hot input:checked + .sw::after { background: #fff; }
.opt .t { display: flex; flex-direction: column; min-width: 0; }
.opt .t b { font-weight: 600; }
.opt .t span { color: var(--muted); font-size: 13px; }
.tag { font: 600 13px var(--f-mono); color: var(--muted); white-space: nowrap; }
.tag.hot { color: var(--hot); }
.tag.good { color: var(--good); }

/* чек-лента */
#tape-wrap { display: flex; flex-direction: column; gap: 10px; }
.tape-h { display: flex; justify-content: space-between; align-items: baseline; font: 400 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tape { border: 1px dashed var(--line); border-radius: 14px; background: var(--panel); padding: 6px 16px; display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); animation: rise .3s ease both; }
.row:last-child { border-bottom: 0; }
.row .l { font-weight: 500; min-width: 0; }
.row .c { grid-column: 1; font: 400 12px var(--f-mono); color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.row .a { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 600 15px var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .a s { color: var(--muted); font-weight: 400; margin-right: 6px; }
.row[data-tone="warn"] .l, .row[data-tone="warn"] .a { color: var(--warn); }
.row[data-tone="hot"] .l, .row[data-tone="hot"] .a { color: var(--hot); }
.row[data-tone="good"] .l, .row[data-tone="good"] .a { color: var(--good); }
.row[data-tone="soft"] .a { color: var(--muted); font-weight: 400; font-size: 13px; }

/* низ: итог */
#bar {
  position: sticky; bottom: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
#bar .sum { display: flex; flex-direction: column; min-width: 0; }
#bar .sum span { font: 400 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
#bar .sum output { font: 600 26px var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* колесо */
.wheel-box { position: relative; width: min(100%, 320px); margin-inline: auto; padding-top: 14px; }
#wheel { display: block; width: 100%; aspect-ratio: 1; border-radius: 50%; will-change: transform; filter: drop-shadow(0 10px 30px rgba(56,189,248,.18)); }
.pointer { position: absolute; top: 0; left: 50%; width: 0; height: 0; transform: translateX(-50%); border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 24px solid var(--fg); z-index: 2; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
.wheel-actions { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
.prize { display: flex; flex-direction: column; gap: 6px; padding: 18px; border: 1px solid var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--accent) 10%, var(--panel)); animation: pop .5s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
.prize .k { font: 400 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.prize .v { font: 700 20px/1.2 var(--f-display); text-wrap: balance; }
.prize .d { color: var(--muted); font-size: 14px; }

/* форма */
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; font-size: 16px; }
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field textarea:focus { border-color: var(--accent); outline: 0; }
.err { margin: 0; font-size: 13px; color: var(--hot); }
.status { margin: 0; font-size: 14px; color: var(--good); }
.orderbox { width: 100%; min-height: 150px; background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 12px; font: 400 12px/1.5 var(--f-mono); color: var(--fg); resize: vertical; }
.after { display: flex; flex-direction: column; gap: 12px; }
.links { display: flex; flex-direction: column; gap: 10px; }

.logo-top { height: 28px; width: auto; display: block; }
.brand { display: flex; align-items: center; gap: 16px; }
.brand img { height: 56px; width: auto; display: block; }
.brand span { font: 700 18px var(--f-display); letter-spacing: -.01em; }
.stamp { display: flex; align-items: center; justify-content: center; gap: 10px; padding-top: 8px; opacity: .75; }
.stamp img { height: 22px; width: auto; display: block; }
.stamp span { font: 400 12px var(--f-mono); letter-spacing: .06em; color: var(--muted); }
.opt.warn input:checked + .sw { background: var(--warn); }
.opt.warn input:checked + .sw::after { background: #1A1400; }
.opt[data-off="true"] { opacity: .45; cursor: default; }
@media (min-width: 600px) { h1 { font-size: 36px; } h2 { font-size: 26px; } .links { flex-direction: row; } }
@media (prefers-reduced-motion: reduce) { *:not(#wheel) { animation: none !important; transition: none !important; } }
</style>

</head>
<body>
<noscript>Для работы калькулятора нужен включённый JavaScript.</noscript>
<div id="app">
  <header id="top" hidden>
    <div class="topline">
      <button type="button" class="icon-btn" id="back" aria-label="Назад">←</button>
      <span class="where" id="where"></span>
      <img id="logo-top" class="logo-top" alt="Логотип" width="28" height="28">
    </div>
    <ol class="tl" id="timeline"></ol>
  </header>

  <main>
    <div id="stage"></div>

const RATES = { direct: 1000, edit: 1000, sound: 100, badVideo: 0.2, badSound: 0.5, urgent: 0.35, light: 0.10, hard: 400 };

/* Сегменты колеса: w = шанс выпадения в процентах (в сумме 100). 85% на призы, которые ведут к следующему заказу, 15% на остальные. */
const SEGMENTS = [
  { label: ["−20%", "след. заказ"],     kind: "next",  title: "Скидка 20% на следующий заказ",   w: 45, bg: "#38BDF8", fg: "#06121F" },
  { label: ["Превью", "в подарок"],     kind: "gift",  title: "Превью для ролика в подарок",     w: 7, bg: "#8B5CF6", fg: "#FFFFFF" },
  { label: ["−10%", "на заказ"],        kind: "pct",   v: 0.10, title: "Скидка 10% на весь заказ", w: 3, bg: "#14B8A6", fg: "#04201C" },
  { label: ["Правки", "бесплатно"],    kind: "light", title: "Бесплатный круг лёгких правок",   w: 5, bg: "#334155", fg: "#FFFFFF" },
  { label: ["−10%", "продюсирование"],  kind: "prod",  title: "Скидка 10% на продюсирование",    w: 40, bg: "#6366F1", fg: "#FFFFFF" }
];

/* ===== Утилиты ===== */
const $ = (s, r = document) => r.querySelector(s);
const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const nf = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const rub = n => nf(n) + " ₽";
const mm = v => (Number.isInteger(v) ? String(v) : String(v).replace(".", ","));
const pl = (n, f) => { n = Math.abs(Math.round(n)); const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? f[0] : (a >= 2 && a <= 4 && (b < 10 || b >= 20)) ? f[1] : f[2]; };
const TR = ["дорожка", "дорожки", "дорожек"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("#logo-top").src = LOGO;

/* ===== Состояние ===== */
const state = {
  step: 0, reached: 0,
  mins: 5, rawH: 2, badVideo: false, tracks: 2, badSound: false,
  urgent: false, light: false, ai: false, graphics: false, nextShoot: false, nextProd: false, nextScript: false, nextPromo: false,
  name: "", contact: "", note: "", prize: null, copied: ""
};
try { const p = localStorage.getItem("wheel-prize-v2"); if (p !== null && SEGMENTS[+p]) state.prize = +p; } catch (e) {}

const STEPS = ["Длина", "Материал", "Брак", "Допы", "Колесо", "Ролик", "Чек"];

const HRS = ["час", "часа", "часов"];
const FIELDS = {
  mins:   { min: 0.5, max: () => 60, step: 0.5, fmt: v => [mm(v), "мин"] },
  rawH:   { min: 1,   max: () => 60, step: 1,   fmt: v => [String(v), pl(v, HRS)] },
  tracks: { min: 0,   max: () => 8,  step: 1,   fmt: v => [String(v), pl(v, TR)] }
};

function setField(k, v) {
  const f = FIELDS[k];
  v = Math.round(v / f.step) * f.step;
  v = Math.max(f.min, Math.min(f.max(), v));
  state[k] = v;
  if (state.tracks === 0) state.badSound = false;
  update();
}

/* ===== Расчёт: каждая строка круглится до рубля, итог = сумма строк ===== */
function model(s) {
  const r = s.reached, L = [];
  const mont = Math.round(s.mins * RATES.edit);
  if (r >= 2) L.push({ k: "direct", label: "Режиссирование", calc: `${s.rawH} ч материала × ${nf(RATES.direct)} ₽`, amount: Math.round(s.rawH * RATES.direct) });
  L.push({ k: "mont", label: "Монтаж", calc: `${mm(s.mins)} мин × ${nf(RATES.edit)} ₽`, amount: mont });
  let montAll = mont;
  if (r >= 3 && s.badVideo) {
    const a = Math.round(mont * RATES.badVideo);
    montAll += a;
    L.push({ k: "badv", label: "Брак в видео · +20%", calc: `${nf(mont)} ₽ × 20%`, amount: a, tone: "warn" });
  }
  if (r >= 3 && s.tracks > 0) {
    const a = Math.round(s.tracks * s.mins * RATES.sound);
    L.push({ k: "snd", label: "Звук", calc: `${s.tracks} ${pl(s.tracks, TR)} × ${mm(s.mins)} мин × ${RATES.sound} ₽`, amount: a });
    if (s.badSound) {
      const b = Math.round(a * RATES.badSound);
      L.push({ k: "bads", label: "Брак в звуке · +50%", calc: `${nf(a)} ₽ × 50%`, amount: b, tone: "warn" });
    }
  }
  const sum = () => L.reduce((t, x) => t + (x.amount || 0), 0);
  const prize = (r >= 5 && s.prize !== null) ? SEGMENTS[s.prize] : null;
  if (r >= 4) {
    if (s.urgent) {
      const base = sum();
      L.push({ k: "urg", label: "Срочность · +35%", calc: `${nf(base)} ₽ × 35%`, amount: Math.round(base * RATES.urgent), tone: "hot" });
    }
    const lightVal = Math.round(montAll * RATES.light);
    if (prize && prize.kind === "light") {
      L.push({ k: "light", label: "Лёгкий круг правок", calc: "в подарок, приз колеса", amount: 0, strike: lightVal, tone: "good" });
    } else if (s.light) {
      L.push({ k: "light", label: "Лёгкий круг правок", calc: `${nf(montAll)} ₽ × 10%`, amount: lightVal });
    }
    if (s.ai) L.push({ k: "ai", label: "ИИ-элементы", calc: "считаем отдельно по смете", amount: null, tone: "soft" });
    if (s.graphics) L.push({ k: "gfx", label: "Сложная инфографика", calc: "считаем отдельно по смете", amount: null, tone: "soft" });
  }
  if (prize) {
    const before = sum();
    if (prize.kind === "pct") {
      L.push({ k: "prize", label: "Приз колеса · −" + Math.round(prize.v * 100) + "%", calc: `${nf(before)} ₽ × ${Math.round(prize.v * 100)}%`, amount: -Math.round(before * prize.v), tone: "good" });
    } else if (prize.kind === "gift") {
      L.push({ k: "prize", label: "Превью для ролика", calc: "в подарок, приз колеса", amount: 0, text: "в подарок", tone: "good" });
    } else if (prize.kind === "next") {
      L.push({ k: "prize", label: "Скидка 20% на следующий заказ", calc: NEXT_ORDER_NOTE + ", приз колеса", amount: 0, text: "−20%", tone: "good" });
    } else if (prize.kind === "prod") {
      L.push({ k: "prize", label: "Скидка 10% на продюсирование", calc: "если закажете продюсирование", amount: 0, text: "−10%", tone: "good" });
    }
  }
  return { L, total: sum() };
}

/* ===== Экраны ===== */
function ctrl(key, label, hint, extra = "") {
  return `<div class="ctrl ${extra}" data-ctrl="${key}">
    <div class="ctrl-h"><label for="r-${key}">${label}</label><span class="hint">${hint}</span></div>
    <div class="num">
      <button type="button" class="nb" data-dec="${key}" aria-label="Меньше">−</button>
      <output class="val" data-out="${key}"></output>
      <button type="button" class="nb" data-inc="${key}" aria-label="Больше">+</button>
    </div>
    <input type="range" id="r-${key}" data-range="${key}">
  </div>`;
}

function waveBars() { // не используется, оставлена на случай возврата декора
  let h = "";
  for (let i = 0; i < 40; i++) {
    const a = 14 + 86 * Math.abs(Math.sin(i * 0.37) * Math.cos(i * 0.11 + 1.2)) + 14 * Math.abs(Math.sin(i * 1.3));
    h += `<i style="height:${Math.min(100, a)}%"></i>`;
  }
  return h;
}

    <button type="button" class="btn" data-go="1">Начать</button>
    <a class="btn ghost" href="${esc(CHANNEL_URL)}" target="_blank" rel="noopener">Смотреть работы в Telegram</a>
    <p class="contact">@${TG_USER}</p>
  </section>`;
  if (n === 1) return `<section class="step">
    <p class="eyebrow">Шаг 1 из 7</p>
    <h2>Какой длины должен быть ролик?</h2>
    <p class="lead">Укажите желаемую длину готового видео.</p>
    ${ctrl("mins", "Желаемая длина видео", "От 30 секунд до часа, шаг в полминуты")}
    <div class="chips" role="group" aria-label="Быстрый выбор">
      ${[1, 3, 5, 10, 15, 30].map(v => `<button type="button" class="chip" data-chip="mins:${v}">${v} мин</button>`).join("")}
    </div>
    <p class="note">Это основа. Дальше добавятся режиссирование по объёму материала, звук и надбавки, если они нужны.</p>
  </section>`;
  if (n === 2) return `<section class="step">
    <p class="eyebrow">Шаг 2 из 7</p>
    <h2>Сколько материала вы отсняли?</h2>
    <p class="lead">Режиссирование строится по объёму отснятого материала. Укажите его в часах.</p>
    ${ctrl("rawH", "Количество отснятого материала", "Суммарно по времени, шаг в один час")}
    <div class="chips" role="group" aria-label="Быстрый выбор">
      ${[1, 2, 4, 8, 12].map(v => `<button type="button" class="chip" data-chip="rawH:${v}">${v} ч</button>`).join("")}
    </div>
  </section>`;
  if (n === 3) return `<section class="step">
    <p class="eyebrow">Шаг 3 из 7</p>
    <h2>Есть ли брак в материале?</h2>
    <p class="lead">Подскажет оператор. Если не знаете, оставьте пустым.</p>
    <div class="opts">
      <label class="opt warn"><input type="checkbox" data-toggle="badSound"><span class="sw"></span><span class="t"><b>Есть ли брак по звуку?</b></span></label>
      <label class="opt warn"><input type="checkbox" data-toggle="badVideo"><span class="sw"></span><span class="t"><b>Есть ли брак по видео?</b></span></label>
    </div>
    ${ctrl("tracks", "Звуковых дорожек", "Петлички, рекордеры: каждая запись отдельно")}
  </section>`;
  if (n === 4) return `<section class="step">
    <p class="eyebrow">Шаг 4 из 7</p>
    <h2>Что добавим сверху?</h2>
    <p class="lead">Включайте только нужное. Позиции «по смете» я посчитаю отдельно и напишу вам.</p>
    <div class="opts">
      <label class="opt hot"><input type="checkbox" data-toggle="urgent"><span class="sw"></span><span class="t"><b>Срочная сдача</b><span>Работа в сжатые сроки</span></span><span class="tag hot">+35%</span></label>
      <label class="opt"><input type="checkbox" data-toggle="light"><span class="sw"></span><span class="t"><b>Лёгкий круг правок</b><span>Один общий круг небольших правок по всему ролику</span></span><span class="tag">+10% к монтажу</span></label>
      <label class="opt"><input type="checkbox" data-toggle="ai"><span class="sw"></span><span class="t"><b>ИИ-элементы</b><span>Считаются под задачу</span></span><span class="tag">по смете</span></label>
      <label class="opt"><input type="checkbox" data-toggle="graphics"><span class="sw"></span><span class="t"><b>Сложная инфографика</b><span>Считается под задачу</span></span><span class="tag">по смете</span></label>
    </div>
    <p class="note">Серьёзные правки после сдачи стоят ${RATES.hard} ₽ за минуту, каждая считается отдельно.</p>
  </section>`;
  if (n === 5) {
    const has = state.prize !== null;
    return `<section class="step">
      <p class="eyebrow">Шаг 5 из 7</p>
      <h2>Расчёт готов. Крутим колесо</h2>
      <p class="lead">Приз достаётся в любом случае и сразу попадает в ваш чек.</p>
      <div class="wheel-box"><span class="pointer" aria-hidden="true"></span><canvas id="wheel" width="320" height="320" aria-label="Колесо фортуны"></canvas></div>
      <div class="wheel-actions" id="wheel-actions">${has ? prizeHTML() : `<button type="button" class="btn" id="spin">Крутить колесо</button>`}</div>
    </section>`;
  }
  if (n === 6) return `<section class="step">
    <p class="eyebrow">Шаг 6 из 7</p>
    <h2>Следующий ролик</h2>
    <p class="lead">Я могу помочь и с тем, что идёт до монтажа. Отметьте, что вам интересно.</p>
    <div class="opts">
      <label class="opt"><input type="checkbox" data-toggle="nextShoot"><span class="sw"></span><span class="t"><b>Съёмка</b></span></label>
      <label class="opt"><input type="checkbox" data-toggle="nextProd"><span class="sw"></span><span class="t"><b>Продюсирование</b></span></label>
      <label class="opt"><input type="checkbox" data-toggle="nextScript"><span class="sw"></span><span class="t"><b>Сценарий</b></span></label>
      <label class="opt"><input type="checkbox" data-toggle="nextPromo"><span class="sw"></span><span class="t"><b>Продвижение канала</b></span></label>
    </div>
  </section>`;
  return `<section class="step">
    <p class="eyebrow">Шаг 7 из 7</p>
    <h2>Ваш чек готов</h2>
    <p class="lead">Это предварительный расчёт. Точную сумму я назову после просмотра материала. Оставьте контакт и отправьте заказ мне в Telegram.</p>
  </section>`;
}

function prizeHTML() {
  const p = SEGMENTS[state.prize];
  const d = p.kind === "pct" ? "Скидка уже учтена в итоговой сумме." :
            p.kind === "light" ? "Лёгкий круг правок войдёт в заказ бесплатно." :
            p.kind === "gift" ? "Превью для ролика входит в заказ бесплатно." :
            p.kind === "next" ? "Скидка 20% на ваш следующий заказ, " + NEXT_ORDER_NOTE + "." :
            "Скидка 10% на продюсирование, если закажете его.";
  return `<div class="prize"><span class="k">Ваш приз</span><span class="v">${esc(p.title)}</span><span class="d">${d}</span></div>`;
}

function tgHref() { return "https://t.me/" + TG_USER + "?text=" + encodeURIComponent(orderText()); }

function formHTML() {
  const pay = PAYMENT_URL ? `<a class="btn pay" href="${esc(PAYMENT_URL)}" target="_blank" rel="noopener">Перейти к оплате</a>` : "";
  return `<form class="form" id="order-form" novalidate>
    <div class="field"><label for="f-name">Как к вам обращаться</label><input id="f-name" data-field="name" autocomplete="name" value="${esc(state.name)}"></div>
    <div class="field"><label for="f-contact">Telegram или телефон</label><input id="f-contact" data-field="contact" autocomplete="off" value="${esc(state.contact)}"><p class="err" id="err" hidden>Оставьте контакт, чтобы я мог вам ответить.</p></div>
    <div class="field"><label for="f-note">О проекте</label><textarea id="f-note" data-field="note" placeholder="Ссылка на материал, сроки, пожелания">${esc(state.note)}</textarea></div>
    <a class="btn" id="tg" href="${esc(tgHref())}" target="_blank" rel="noopener">Отправить в Telegram</a>
    <p class="note">Откроется чат со мной, заказ уже будет вписан. Он дойдёт до меня, когда вы нажмёте «Отправить» в Telegram.</p>
    <button type="submit" class="btn ghost" id="copy">Скопировать заказ</button>
    <div class="after" id="after" ${state.copied ? "" : "hidden"}>
      <p class="status" id="status"></p>
      <textarea class="orderbox" id="orderbox" readonly aria-label="Текст заказа"></textarea>
    </div>
    ${pay}
    <button type="button" class="btn ghost" id="restart">Пересчитать заново</button>
  </form>`;
}

/* ===== Рендер ===== */
function render() {
  const n = state.step;
  $("#stage").innerHTML = stepHTML(n);
  $("#stage2").innerHTML = n === 7 ? `<div class="step">${formHTML()}<div class="stamp"><img src="${LOGO}" alt=""><span>@${TG_USER}</span></div></div>` : "";
  $("#top").hidden = n === 0;
  $("#bar").hidden = n === 0;
  $("#tape-wrap").hidden = n === 0;
  $("#tape-title").textContent = n === 7 ? "Ваш чек" : "Чек-лента";
  $("#where").textContent = n === 0 ? "" : `Шаг ${n} из 7 · ${STEPS[n - 1]}`;
  $("#back").disabled = n <= 1;
  $("#next").hidden = n === 7;
  buildTimeline();
  if (n === 5) {
    drawWheel(); setWheelPose();
    if (document.fonts && document.fonts.load) document.fonts.load('600 16px "Golos Text"').then(() => { if (state.step === 5) drawWheel(); }).catch(() => {});
  }
  if (n === 7 && state.copied) { $("#orderbox").value = state.copied; $("#status").textContent = state.statusText || ""; }
  update();
  window.scrollTo({ top: 0 });
}

function buildTimeline() {
  $("#timeline").innerHTML = STEPS.map((t, i) => {
    const s = i + 1, st = s === state.step ? "now" : s < state.step || s <= state.reached ? "done" : "off";
    return `<li data-state="${st}"><button type="button" data-go="${s}" ${st === "off" ? "disabled" : ""} aria-label="${t}"><span class="clip"></span><span class="lab">${t}</span></button></li>`;
  }).join("");
}

const tapeEls = new Map();
function renderTape(L) {
  const tape = $("#tape");
  const keep = new Set(L.map(x => x.k));
  for (const [k, el] of tapeEls) if (!keep.has(k)) { el.remove(); tapeEls.delete(k); }
  let prev = null;
  L.forEach(x => {
    let el = tapeEls.get(x.k);
    if (!el) { el = document.createElement("div"); el.className = "row"; el.innerHTML = `<span class="l"></span><span class="c"></span><span class="a"></span>`; tapeEls.set(x.k, el); }
    el.dataset.tone = x.tone || (x.amount === null ? "soft" : "");
    const l = el.children[0], c = el.children[1], a = el.children[2];
    if (l.textContent !== x.label) l.textContent = x.label;
    if (c.textContent !== x.calc) c.textContent = x.calc;
    const amt = x.text || (x.amount === null ? "по смете" : (x.amount < 0 ? "−" + rub(-x.amount) : rub(x.amount)));
    const html = (x.strike ? `<s>${rub(x.strike)}</s>` : "") + esc(amt);
    if (a.innerHTML !== html) a.innerHTML = html;
    if (el.parentNode !== tape || el.previousElementSibling !== prev) tape.insertBefore(el, prev ? prev.nextSibling : tape.firstChild);
    prev = el;
  });
  $("#tape-count").textContent = L.length + " " + pl(L.length, ["строка", "строки", "строк"]);
}

let shown = 0, raf = 0, lastTotal = null;
function setTotal(v) {
  if (v === lastTotal) return;
  lastTotal = v;
  cancelAnimationFrame(raf);
  const from = shown, t0 = performance.now(), dur = reduce ? 0 : 450;
  const out = $("#total");
  const f = t => {
    const p = dur ? Math.min(1, (t - t0) / dur) : 1, e = 1 - Math.pow(1 - p, 3);
    shown = from + (v - from) * e;
    out.textContent = rub(shown);
    if (p < 1) raf = requestAnimationFrame(f);
  };
  raf = requestAnimationFrame(f);
}

function update() {
  const m = model(state);
  document.querySelectorAll("[data-out]").forEach(o => {
    const k = o.dataset.out, f = FIELDS[k], [num, unit] = f.fmt(state[k]);
    o.innerHTML = `<b>${num}</b><small>${unit}</small>`;
  });
  document.querySelectorAll("[data-range]").forEach(r => {
    const k = r.dataset.range, f = FIELDS[k], max = f.max(), off = f.off ? f.off() : false;
    r.min = f.min; r.max = max; r.step = f.step; r.value = state[k]; r.disabled = off;
    r.style.setProperty("--p", max > f.min ? ((state[k] - f.min) / (max - f.min) * 100) + "%" : "0%");
    const box = r.closest(".ctrl"); if (box) box.dataset.off = off ? "true" : "false";
    const dec = box.querySelector("[data-dec]"), inc = box.querySelector("[data-inc]");
    dec.disabled = off || state[k] <= f.min; inc.disabled = off || state[k] >= max;
  });
  document.querySelectorAll("[data-chip]").forEach(c => { const [ck, cv] = c.dataset.chip.split(":"); c.setAttribute("aria-pressed", String(+cv === state[ck])); });
  document.querySelectorAll("[data-toggle]").forEach(t => { t.checked = !!state[t.dataset.toggle]; });
  const bsw = $('[data-toggle="badSound"]');
  if (bsw) { bsw.disabled = state.tracks === 0; bsw.closest(".opt").dataset.off = String(state.tracks === 0); }
  if (state.step > 0) renderTape(m.L);
  setTotal(m.total);
  $("#bar .sum span").textContent = state.step === 1 ? "Основа" : "Итого";
  const next = $("#next");
  if (state.step === 5) { next.disabled = state.prize === null; next.textContent = state.prize === null ? "Сначала колесо" : "Далее"; }
  else if (state.step === 6) { next.disabled = false; next.textContent = "К чеку"; }
  else { next.disabled = false; next.textContent = "Далее"; }
}

/* ===== Колесо ===== */
const logoImg = new Image();
logoImg.onload = () => { if (state.step === 5) drawWheel(); };
logoImg.src = LOGO;

function drawWheel() {
  const cv = $("#wheel"); if (!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1), size = cv.clientWidth || 300;
  cv.width = cv.height = Math.round(size * dpr);
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const c = size / 2, R = c - 4, a = 2 * Math.PI / SEGMENTS.length;
  ctx.clearRect(0, 0, size, size);
  SEGMENTS.forEach((sg, i) => {
    const a0 = -Math.PI / 2 + i * a;
    ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, R, a0, a0 + a); ctx.closePath();
    ctx.fillStyle = sg.bg; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#0A0F1E"; ctx.stroke();
    ctx.save(); ctx.translate(c, c); ctx.rotate(a0 + a / 2);
    ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillStyle = sg.fg;
    const fs = Math.round(size * 0.054);
    ctx.font = `600 ${fs}px "Golos Text", system-ui, sans-serif`;
    ctx.fillText(sg.label[0], R - 16, -fs * 0.42);
    ctx.font = `500 ${Math.max(10, Math.round(size * 0.036))}px "Golos Text", system-ui, sans-serif`;
    ctx.globalAlpha = 0.9; ctx.fillText(sg.label[1], R - 16, fs * 0.62); ctx.globalAlpha = 1;
    ctx.restore();
  });
  ctx.beginPath(); ctx.arc(c, c, R, 0, 2 * Math.PI); ctx.lineWidth = 4; ctx.strokeStyle = "#26335A"; ctx.stroke();
  ctx.beginPath(); ctx.arc(c, c, size * 0.10, 0, 2 * Math.PI); ctx.fillStyle = "#0A0F1E"; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = "#38BDF8"; ctx.stroke();
  if (logoImg.complete && logoImg.naturalWidth) { const h = size * 0.11; ctx.drawImage(logoImg, c - h / 2, c - h / 2, h, h); }
}

const SEG = 360 / SEGMENTS.length;
let rot = 0, spinning = false;
function setWheelPose() {
  const cv = $("#wheel"); if (!cv) return;
  cv.style.transition = "none";
  rot = state.prize !== null ? -(state.prize * SEG + SEG / 2) : 0;
  cv.style.transform = `rotate(${rot}deg)`;
}
function pick() {
  const total = SEGMENTS.reduce((t, s) => t + s.w, 0);
  let r = Math.random() * total;
  for (let i = 0; i < SEGMENTS.length; i++) { r -= SEGMENTS[i].w; if (r < 0) return i; }
  return SEGMENTS.length - 1;
}
function spin() {
  if (spinning || state.prize !== null) return;
  spinning = true;
  const btn = $("#spin"); btn.disabled = true; btn.textContent = "Крутится…";
  const cv = $("#wheel"), idx = pick();
  const center = idx * SEG + SEG / 2, jitter = (Math.random() - 0.5) * SEG * 0.7;
  const base = Math.ceil(rot / 360) * 360 + 360 * 6;
  rot = base - center + jitter;
  const dur = reduce ? 1 : 5.6;
  cv.style.transition = `transform ${dur}s cubic-bezier(.12,.62,.08,1)`;
  cv.style.transform = `rotate(${rot}deg)`;
  let done = false;
  const finish = () => {
    if (done) return; done = true; spinning = false;
    state.prize = idx;
    try { localStorage.setItem("wheel-prize-v2", String(idx)); } catch (e) {}
    $("#wheel-actions").innerHTML = prizeHTML();
    update();
  };
  cv.addEventListener("transitionend", finish, { once: true });
  setTimeout(finish, dur * 1000 + 500);
}

/* ===== Заказ ===== */
function orderText() {
  const m = model(state), s = state;
  const out = ["Заказ ролика (предварительный расчёт)", ""];
  out.push(`Желаемая длина ролика: ${mm(s.mins)} мин`);
  out.push(`Отснятого материала: ${s.rawH} ч`);
  if (s.badVideo) out.push("Брак по видео: да");
  out.push(`Звуковых дорожек: ${s.tracks}`);
  if (s.badSound && s.tracks > 0) out.push("Брак по звуку: да");
  const ex = [s.urgent && "срочно", s.light && "лёгкий круг правок", s.ai && "ИИ-элементы", s.graphics && "сложная инфографика"].filter(Boolean);
  if (ex.length) out.push("Дополнительно: " + ex.join(", "));
  out.push("", "Расчёт:");
  m.L.forEach(x => out.push(`- ${x.label}: ` + (x.text || (x.amount === null ? "по смете" : (x.amount < 0 ? "−" + rub(-x.amount) : rub(x.amount)))) + (x.amount === 0 && x.strike ? " (подарок)" : "")));
  out.push("", `Итого (предварительно): ${rub(m.total)}`);
  if (s.prize !== null) out.push(`Приз колеса: ${SEGMENTS[s.prize].title}`);
  out.push("", `Имя: ${s.name || "—"}`, `Контакт: ${s.contact}`);
  if (s.note) out.push(`О проекте: ${s.note}`);
  return out.join("\n");
}

async function submitOrder(e) {
  e.preventDefault();
  const err = $("#err");
  if (!state.contact.trim()) { err.hidden = false; $("#f-contact").focus(); return; }
  err.hidden = true;
  const text = orderText();
  state.copied = text;
  $("#after").hidden = false;
  const box = $("#orderbox"); box.value = text;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (x) {}
  if (!ok) { box.focus(); box.select(); }
  state.statusText = ok ? "Заказ скопирован. Вставьте его в чат со мной: @" + TG_USER + "." : "Скопируйте текст ниже и отправьте мне в Telegram: @" + TG_USER + ".";
  $("#status").textContent = state.statusText;
}

/* ===== Навигация и события ===== */
function go(n) {
  n = Math.max(0, Math.min(7, n));
  if (n > state.reached) state.reached = n;
  state.step = n;
  render();
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.go) { const n = +t.dataset.go; if (n <= state.reached || n === state.step + 1) go(n); return; }
  if (t.dataset.dec) { const k = t.dataset.dec; setField(k, state[k] - FIELDS[k].step); return; }
  if (t.dataset.inc) { const k = t.dataset.inc; setField(k, state[k] + FIELDS[k].step); return; }
  if (t.dataset.chip) { const [ck, cv] = t.dataset.chip.split(":"); setField(ck, +cv); return; }
  if (t.id === "tg") {
    if (!state.contact.trim()) { e.preventDefault(); $("#err").hidden = false; $("#f-contact").focus(); return; }
    $("#err").hidden = true; t.href = tgHref();
    try { navigator.clipboard.writeText(orderText()).catch(() => {}); } catch (x) {}
    return;
  }
  if (t.id === "back") { go(state.step - 1); return; }
  if (t.id === "next") { if (state.step === 5 && state.prize === null) return; go(state.step + 1); return; }
  if (t.id === "spin") { spin(); return; }
  if (t.id === "restart") {
    Object.assign(state, { reached: 1, mins: 5, rawH: 2, badVideo: false, tracks: 2, badSound: false, urgent: false, light: false, ai: false, graphics: false, nextShoot: false, nextProd: false, nextScript: false, nextPromo: false, copied: "" });
    go(1);
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.range) setField(t.dataset.range, +t.value);
  else if (t.dataset.field) { state[t.dataset.field] = t.value; const g = $("#tg"); if (g) g.href = tgHref(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.toggle) { state[t.dataset.toggle] = t.checked; update(); }
});
document.addEventListener("submit", e => { if (e.target.id === "order-form") submitOrder(e); });
window.addEventListener("resize", () => { if (state.step === 5) { drawWheel(); } });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (state.step === 5) drawWheel(); });

render();
</script>
</body>
</html>
